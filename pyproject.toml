[build-system]
requires = [
"setuptools>=61",
"wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "nencarta"
version = "0.3.0"
description = "A library for estimating riverine bathymetry and performing flood inundation mapping."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Joseph Gutenson", email = "joseph@follumhydro.com" },
]
license = { text = "MIT" }
dependencies = [
"dask",
"gdal",
"geopandas",
"netCDF4",
"networkx",
"numba",
"numpy",
"pandas",
"pipefunc",
"pyarrow",
"pyproj",
"PyQt5>=5.15",
"pyyaml",
"requests",
"rich",
"s3fs",
"scipy",
"shapely",
"tqdm",
"xarray",
"zarr"
]

[project.scripts]
flood-mapping = "nencarta.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nencarta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "build",
    "dist",
    "ignore",
    "pytest_tmp",
]

[tool.ruff]
extend-exclude = [
    "tests/*.py",
    "docs",
]
