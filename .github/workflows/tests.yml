name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ARC and Curve2Flood are not on conda-forge. These are the branches nencarta is developed against.
  ARC_GIT: https://github.com/RickytheGuy/automated-rating-curve-byu.git@arc_overhaul
  CURVE2FLOOD_GIT: https://github.com/RickytheGuy/curve2flood.git@fldpln-fast-faithful

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        # A login shell, so the conda environment is active in every step
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Create the conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yaml
          activate-environment: nencarta_py312
          conda-remove-defaults: true

      # Every dependency comes from conda, so pip installs these three packages without theirs,
      # and pip check fails if environment.yaml is missing one
      - name: Install ARC, Curve2Flood and nencarta
        run: |
          python -m pip install --no-deps "git+${ARC_GIT}" "git+${CURVE2FLOOD_GIT}"
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -ra

  docs:
    # Builds the documentation as Read the Docs does, failing on any warning, such as a broken link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the documentation
        run: |
          python -m pip install -r docs/requirements.txt
          mkdocs build --strict
